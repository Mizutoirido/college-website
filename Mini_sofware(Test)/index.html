<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ລະບົບບໍລິຫານວິທະຍາໄລ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#16202E; --muted:#5E6B7C; --line:#DCE1E8;
  --navy:#0B2A5B; --navy-2:#173F85; --red:#C8102E; --ok:#1B7F4B; --focus:#2F6FE0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F141B; --surface:#171E28; --ink:#E8EDF3; --muted:#9AA7B8; --line:#2A3441; --navy:#0A1E42; --navy-2:#2A5CB8; --red:#E5485F; --ok:#4CC38A; --focus:#6FA0FF; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Noto Sans Lao","Phetsarath OT",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--navy);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 18px;font-weight:700;font-size:17px;line-height:1.35}
.brand small{display:block;font-weight:400;opacity:.7;font-size:12.5px;margin-top:2px}
.nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:#fff;text-decoration:none;opacity:.82}
.nav a:hover{background:rgba(255,255,255,.1);opacity:1}
.nav a.active{background:#fff;color:var(--navy);opacity:1;font-weight:700}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:19px;margin:0;flex:1}
.menu-btn{display:none}
.content{padding:24px;max-width:1400px;width:100%}
.badge{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.admin{background:var(--ok);border-color:var(--ok);color:#fff}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--navy-2);border-color:var(--navy-2);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=tel],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.bar input,.bar select{width:auto;min-width:180px}

/* data */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);color:var(--muted);font-weight:500;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.act{white-space:nowrap}
td.act .btn+.btn{margin-left:6px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.rp-photo{width:52px;height:64px;object-fit:cover;border-radius:6px;background:var(--line);display:block}
.empty{padding:40px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{color:var(--muted)}
.note{padding:12px 16px;border-radius:8px;background:#FFF4D6;color:#5A4300;margin-bottom:16px}

/* modal */
dialog{border:0;border-radius:12px;padding:0;width:min(760px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,16,30,.55)}
.dlg-h{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.dlg-b{padding:20px 22px;max-height:70vh;overflow:auto}
.dlg-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:3px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.detail-photo{width:150px;height:190px;object-fit:cover;border-radius:12px;background:var(--line);display:block;margin:0 auto 6px}
.detail-name{text-align:center;font-weight:700;font-size:18px}
.detail-sub{text-align:center;color:var(--muted);margin-bottom:16px}
.detail-row{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:9px 4px;border-top:1px solid var(--line)}
.detail-row span{color:var(--muted)}
@media (max-width:820px){.detail-row{grid-template-columns:1fr;gap:0}}
@media print{dialog#viewDlg{box-shadow:none;width:100%}.dlg-f{display:none}}
.preview{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--line);display:block;margin-bottom:8px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:50}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .2s;z-index:20}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .content{padding:16px}
  .grid{grid-template-columns:1fr}
}
@media print{
  .side,.top,.bar,.act,.menu-btn{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
  .content{padding:0}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">ລະບົບບໍລິຫານວິທະຍາໄລ<small>College Administration System</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <button class="btn menu-btn" id="menuBtn" aria-label="ເປີດເມນູ">☰</button>
      <h1 id="pageTitle"></h1>
      <span class="badge" id="roleBadge">ຜູ້ເບິ່ງ</span>
      <button class="btn" id="authBtn">ເຂົ້າສູ່ລະບົບຜູ້ບໍລິຫານ</button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- login -->
<dialog id="loginDlg">
  <form method="dialog" id="loginForm" autocomplete="on">
    <div class="dlg-h">ເຂົ້າສູ່ລະບົບຜູ້ບໍລິຫານ</div>
    <div class="dlg-b">
      <p style="margin-top:0;color:var(--muted)">ສະເພາະຜູ້ບໍລິຫານເທົ່ານັ້ນ ຈຶ່ງແກ້ໄຂ ຫຼື ລົບຂໍ້ມູນໄດ້.</p>
      <label for="lEmail">ອີເມວ</label><input type="email" id="lEmail" required autocomplete="username">
      <div style="height:12px"></div>
      <label for="lPass">ລະຫັດຜ່ານ</label><input type="password" id="lPass" required autocomplete="current-password">
      <div class="err" id="lErr"></div>
    </div>
    <div class="dlg-f">
      <button class="btn" type="button" id="lCancel">ຍົກເລີກ</button>
      <button class="btn primary" type="submit" id="lSubmit">ເຂົ້າສູ່ລະບົບ</button>
    </div>
  </form>
</dialog>

<!-- generic form dialog -->
<dialog id="formDlg">
  <form method="dialog" id="formEl">
    <div class="dlg-h" id="formTitle"></div>
    <div class="dlg-b" id="formBody"></div>
    <div class="dlg-f">
      <span class="err" id="formErr" style="margin-right:auto"></span>
      <button class="btn" type="button" id="formCancel">ຍົກເລີກ</button>
      <button class="btn primary" type="submit" id="formSave">ບັນທຶກ</button>
    </div>
  </form>
</dialog>
<!-- student detail -->
<dialog id="viewDlg">
  <div class="dlg-h">ຂໍ້ມູນນັກສຶກສາ</div>
  <div class="dlg-b" id="viewBody"></div>
  <div class="dlg-f"><button class="btn primary" id="viewClose" type="button">ປິດ</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* =====================================================
   1) ຕັ້ງຄ່າ: ໃສ່ຄ່າຈາກ Supabase > Project Settings > API
   ===================================================== */
const SUPABASE_URL = "https://pqbbcupnzblkaakxmohd.supabase.co";       // ເຊັ່ນ https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxYmJjdXBuemJsa2Fha3htb2hkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2ODIzMjksImV4cCI6MjEwOTI1ODMyOX0.eJWLQ_9CIImODdB4pMPnST10Mm50TY4WL1toMP3VLWM";

/* =====================================================
   2) ເມນູ: ຢາກເພີ່ມເມນູໃໝ່ ໃຫ້ເພີ່ມອີກ 1 ແຖວໃນ MENUS
      { id:'ຊື່ລິ້ງ', icon:'ໄອຄອນ', label:'ຊື່ເມນູ', render: ຟັງຊັນທີ່ສ້າງໜ້າ }
   ===================================================== */
const MENUS = [
  { id:'home',     icon:'🏠', label:'ໜ້າຫຼັກ',            render: renderHome },
  { id:'years',    icon:'📅', label:'ສົກຮຽນ',             render: renderYears },
  { id:'students', icon:'🎓', label:'ປະຫວັດນັກສຶກສາ',      render: renderStudents },
  // ຕົວຢ່າງເມນູໃນອະນາຄົດ:
  // { id:'teachers', icon:'👩‍🏫', label:'ຄູອາຈານ', render: renderTeachers },
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LAO_M = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
const EN_M  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const p2 = n => String(n).padStart(2,'0');
function dobText(iso){ if(!iso) return {lo:'',en:''}; const [y,m,d]=iso.split('-').map(Number); return {lo:`${p2(d)} ${LAO_M[m-1]} ${y}`, en:`${p2(d)} ${EN_M[m-1]} ${y}`}; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',2600); }

const configured = !SUPABASE_URL.startsWith('PASTE');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let session = null;
const isAdmin = () => !!session;

/* ---------- data ---------- */
const COLS = [
  ['year_name','ສົກຮຽນ'],['first_name_lo','ຊື່ (ລາວ)'],['last_name_lo','ນາມສະກຸນ (ລາວ)'],
  ['first_name_en','First name'],['last_name_en','Last name'],['gender','ເພດ'],
  ['dob_lo','ວັນເກີດ (ລາວ)'],['dob_en','Date of birth'],
  ['birth_village','ບ້ານເກີດ'],['birth_district','ເມືອງ'],['birth_province','ແຂວງ'],
  ['high_school','ຈົບ ມ.7 ຈາກ ມ.ສ'],['phone','ເບີໂທ'],['father_phone','ເບີໂທພໍ່'],
  ['mother_phone','ເບີໂທແມ່'],['emergency_phone','ເບີໂທສຸກເສີນ']
];
async function getYears(){ const {data,error}=await sb.from('academic_years').select('*').order('year_name',{ascending:false}); if(error) throw error; return data; }
async function getStudents(yearId){
  let q = sb.from('students').select('*, academic_years(year_name)').order('id',{ascending:true});
  if(yearId) q = q.eq('academic_year_id', yearId);
  const {data,error} = await q; if(error) throw error;
  return data.map(r => ({...r, year_name: r.academic_years?.year_name || ''}));
}
function exportExcel(rows, name){
  const out = rows.map((r,i)=>{ const o={'ລ/ດ':i+1}; COLS.forEach(([k,l])=>o[l]=r[k]??''); o['ຮູບພາບ (URL)']=r.photo_url||''; return o; });
  const ws = XLSX.utils.json_to_sheet(out); ws['!cols']=Object.keys(out[0]||{}).map(()=>({wch:18}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'ນັກສຶກສາ');
  XLSX.writeFile(wb, `${name}-${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ---------- router / shell ---------- */
function buildNav(){
  $('#nav').innerHTML = MENUS.map(m=>`<a href="#/${m.id}" data-id="${m.id}"><span>${m.icon}</span>${esc(m.label)}</a>`).join('');
}
async function route(){
  const id = (location.hash.replace('#/','')||MENUS[0].id);
  const m = MENUS.find(x=>x.id===id) || MENUS[0];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.id===m.id));
  $('#pageTitle').textContent = m.label; $('#side').classList.remove('open');
  const v = $('#view');
  if(!configured){ v.innerHTML = `<div class="note">ຍັງບໍ່ໄດ້ເຊື່ອມຖານຂໍ້ມູນ: ເປີດໄຟລ໌ index.html ແລ້ວໃສ່ SUPABASE_URL ແລະ SUPABASE_ANON_KEY.</div>`; return; }
  v.innerHTML = `<div class="empty">ກຳລັງໂຫຼດ…</div>`;
  try{ await m.render(v); }catch(e){ v.innerHTML = `<div class="note">ໂຫຼດຂໍ້ມູນບໍ່ສຳເລັດ: ${esc(e.message)}</div>`; }
}
function paintAuth(){
  $('#roleBadge').textContent = isAdmin() ? 'ຜູ້ບໍລິຫານ' : 'ຜູ້ເບິ່ງ';
  $('#roleBadge').classList.toggle('admin', isAdmin());
  $('#authBtn').textContent = isAdmin() ? 'ອອກຈາກລະບົບ' : 'ເຂົ້າສູ່ລະບົບຜູ້ບໍລິຫານ';
}

/* ---------- pages ---------- */
async function renderHome(v){
  const [years, students] = await Promise.all([getYears(), getStudents()]);
  const male = students.filter(s=>s.gender==='ຊາຍ').length, female = students.filter(s=>s.gender==='ຍິງ').length;
  v.innerHTML = `<div class="stats">
    <div class="stat"><b>${students.length}</b><span>ນັກສຶກສາທັງໝົດ</span></div>
    <div class="stat"><b>${years.length}</b><span>ສົກຮຽນ</span></div>
    <div class="stat"><b>${male}</b><span>ຊາຍ</span></div>
    <div class="stat"><b>${female}</b><span>ຍິງ</span></div></div>
    <div class="panel"><div class="tablewrap"><table><thead><tr><th>ສົກຮຽນ</th><th>ຈຳນວນນັກສຶກສາ</th></tr></thead><tbody>
    ${years.map(y=>`<tr><td>${esc(y.year_name)}</td><td>${students.filter(s=>s.academic_year_id===y.id).length}</td></tr>`).join('') || '<tr><td colspan="2" class="empty">ຍັງບໍ່ມີສົກຮຽນ</td></tr>'}
    </tbody></table></div></div>`;
}

async function renderYears(v){
  const years = await getYears();
  v.innerHTML = `<div class="bar"><span class="grow"></span>${isAdmin()?'<button class="btn primary" id="addYear">+ ເພີ່ມສົກຮຽນ</button>':''}</div>
  <div class="panel"><div class="tablewrap"><table><thead><tr><th>ລ/ດ</th><th>ສົກຮຽນ</th>${isAdmin()?'<th class="act-h"></th>':''}</tr></thead><tbody>
  ${years.length? years.slice().reverse().map((y,i)=>`<tr><td>${i+1}</td><td>${esc(y.year_name)}</td>${isAdmin()?`<td class="act"><button class="btn sm" data-e="${y.id}">ແກ້ໄຂ</button><button class="btn sm danger" data-d="${y.id}">ລົບ</button></td>`:''}</tr>`).join('') : '<tr><td colspan="3" class="empty">ຍັງບໍ່ມີສົກຮຽນ</td></tr>'}
  </tbody></table></div></div>`;
  if(!isAdmin()) return;
  const yearForm = (y)=> openForm(y?'ແກ້ໄຂສົກຮຽນ':'ເພີ່ມສົກຮຽນ',
    `<label for="fy">ສົກຮຽນ (ຕົວຢ່າງ: 2026-2027)</label><input type="text" id="fy" required pattern="\\d{4}-\\d{4}" value="${esc(y?.year_name||'')}">`,
    async()=>{ const val=$('#fy').value.trim(); const r = y? await sb.from('academic_years').update({year_name:val}).eq('id',y.id) : await sb.from('academic_years').insert({year_name:val}); if(r.error) throw r.error; });
  $('#addYear').onclick=()=>yearForm();
  v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>yearForm(years.find(y=>y.id==b.dataset.e)));
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ if(!confirm('ລົບສົກຮຽນນີ້ແທ້ບໍ?')) return; const {error}=await sb.from('academic_years').delete().eq('id',b.dataset.d); if(error) return alert('ລົບບໍ່ໄດ້ (ອາດມີນັກສຶກສາໃນສົກຮຽນນີ້): '+error.message); toast('ລົບແລ້ວ'); route(); });
}

let stFilter = {year:'', q:''};
async function renderStudents(v){
  const years = await getYears();
  const rows = await getStudents(stFilter.year);
  const q = stFilter.q.trim().toLowerCase();
  const shown = q ? rows.filter(r=>[r.first_name_lo,r.last_name_lo,r.first_name_en,r.last_name_en,r.phone].join(' ').toLowerCase().includes(q)) : rows;
  v.innerHTML = `<div class="bar">
    <select id="fYear" aria-label="ເລືອກສົກຮຽນ"><option value="">ທຸກສົກຮຽນ</option>${years.map(y=>`<option value="${y.id}" ${String(y.id)===String(stFilter.year)?'selected':''}>${esc(y.year_name)}</option>`).join('')}</select>
    <input type="text" id="fQ" placeholder="ຄົ້ນຫາຊື່ ຫຼື ເບີໂທ" value="${esc(stFilter.q)}">
    <span class="grow"></span>
    <button class="btn" id="xl">ສົ່ງອອກ Excel</button>
    <button class="btn primary" id="addSt">+ ເພີ່ມນັກສຶກສາ</button></div>
  <div class="panel"><div class="tablewrap"><table><thead><tr><th>ລ/ດ</th><th>ຮູບ</th><th>ສົກຮຽນ</th><th>ຊື່ ແລະ ນາມສະກຸນ</th><th>Name</th><th>ເພດ</th><th>ວັນເກີດ</th><th>ເບີໂທ</th><th></th></tr></thead><tbody>
  ${shown.length? shown.map((r,i)=>`<tr><td>${i+1}</td><td>${r.photo_url?`<img class="avatar" src="${esc(r.photo_url)}" alt="">`:'<span class="avatar"></span>'}</td><td>${esc(r.year_name)}</td><td>${esc(r.first_name_lo)} ${esc(r.last_name_lo)}</td><td>${esc(r.first_name_en)} ${esc(r.last_name_en)}</td><td>${esc(r.gender)}</td><td>${esc(r.dob_lo)}</td><td>${esc(r.phone)}</td>
    <td class="act"><button class="btn sm" data-v="${r.id}">ເບິ່ງ</button>${isAdmin()?`<button class="btn sm" data-e="${r.id}">ແກ້ໄຂ</button><button class="btn sm danger" data-d="${r.id}">ລົບ</button>`:''}</td></tr>`).join('') : '<tr><td colspan="9" class="empty">ບໍ່ພົບຂໍ້ມູນນັກສຶກສາ</td></tr>'}
  </tbody></table></div></div>`;
  $('#fYear').onchange = e=>{ stFilter.year=e.target.value; route(); };
  $('#fQ').onchange = e=>{ stFilter.q=e.target.value; route(); };
  $('#xl').onclick = ()=> shown.length ? exportExcel(shown,'students') : toast('ບໍ່ມີຂໍ້ມູນໃຫ້ສົ່ງອອກ');
  $('#addSt').onclick = ()=>studentForm(null, years);
  v.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>viewStudent(rows.find(r=>r.id==b.dataset.v)));
  if(!isAdmin()) return;
  v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>studentForm(rows.find(r=>r.id==b.dataset.e), years));
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ if(!confirm('ລົບນັກສຶກສາຄົນນີ້ແທ້ບໍ?')) return; const {error}=await sb.from('students').delete().eq('id',b.dataset.d); if(error) return alert(error.message); toast('ລົບແລ້ວ'); route(); });
}

function studentForm(s, years){
  if(!years.length) return alert('ກະລຸນາເພີ່ມສົກຮຽນກ່ອນ.');
  const f = (id,label,val='',type='text',full=false,req=false)=>`<div class="${full?'full':''}"><label for="${id}">${label}</label><input type="${type}" id="${id}" value="${esc(val)}" ${req?'required':''}></div>`;
  const body = `<div class="grid">
    <div><label for="s_year">ເລືອກສົກຮຽນ</label><select id="s_year" required>${years.map(y=>`<option value="${y.id}" ${s&&s.academic_year_id===y.id?'selected':''}>${esc(y.year_name)}</option>`).join('')}</select></div>
    <div><label for="s_gender">ເພດ</label><select id="s_gender"><option ${s?.gender==='ຊາຍ'?'selected':''}>ຊາຍ</option><option ${s?.gender==='ຍິງ'?'selected':''}>ຍິງ</option></select></div>
    <div class="full"><label for="s_photo">ຮູບພາບ (ບໍ່ເກີນ 2 MB)</label>${s?.photo_url?`<img class="preview" src="${esc(s.photo_url)}" alt="">`:''}<input type="file" id="s_photo" accept="image/*"></div>
    ${f('s_fl','ຊື່ (ລາວ)',s?.first_name_lo,'text',false,true)}${f('s_ll','ນາມສະກຸນ (ລາວ)',s?.last_name_lo,'text',false,true)}
    ${f('s_fe','First name (English)',s?.first_name_en)}${f('s_le','Last name (English)',s?.last_name_en)}
    ${f('s_dob','ວັນເດືອນປີເກີດ',s?.dob||'','date',true)}
    ${f('s_vil','ບ້ານເກີດ',s?.birth_village)}${f('s_dis','ເມືອງ',s?.birth_district)}${f('s_pro','ແຂວງ',s?.birth_province,'text',true)}
    ${f('s_hs','ຮຽນຈົບ ມ.7 ຈາກ ມ.ສ',s?.high_school,'text',true)}
    ${f('s_ph','ເບີໂທ',s?.phone,'tel')}${f('s_fp','ເບີໂທພໍ່',s?.father_phone,'tel')}${f('s_mp','ເບີໂທແມ່',s?.mother_phone,'tel')}${f('s_ep','ເບີໂທສຸກເສີນ',s?.emergency_phone,'tel')}
  </div>`;
  openForm(s?'ແກ້ໄຂປະຫວັດນັກສຶກສາ':'ເພີ່ມນັກສຶກສາ', body, async()=>{
    let photo_url = s?.photo_url || null;
    const file = $('#s_photo').files[0];
    if(file){
      if(file.size > 2*1024*1024) throw new Error('ຮູບໃຫຍ່ເກີນ 2 MB');
      const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${(file.name.split('.').pop()||'jpg').toLowerCase()}`;
      const up = await sb.storage.from('student-photos').upload(path, file); if(up.error) throw up.error;
      photo_url = sb.storage.from('student-photos').getPublicUrl(path).data.publicUrl;
    }
    const dob = $('#s_dob').value || null, t = dobText(dob);
    const row = { academic_year_id:+$('#s_year').value, photo_url, gender:$('#s_gender').value,
      first_name_lo:$('#s_fl').value.trim(), last_name_lo:$('#s_ll').value.trim(),
      first_name_en:$('#s_fe').value.trim(), last_name_en:$('#s_le').value.trim(),
      dob, dob_lo:t.lo, dob_en:t.en,
      birth_village:$('#s_vil').value.trim(), birth_district:$('#s_dis').value.trim(), birth_province:$('#s_pro').value.trim(),
      high_school:$('#s_hs').value.trim(), phone:$('#s_ph').value.trim(), father_phone:$('#s_fp').value.trim(),
      mother_phone:$('#s_mp').value.trim(), emergency_phone:$('#s_ep').value.trim() };
    const r = s ? await sb.from('students').update(row).eq('id',s.id) : await sb.from('students').insert(row);
    if(r.error) throw r.error;
  });
}

function viewStudent(r){
  if(!r) return;
  const rows = [
    ['ສົກຮຽນ',r.year_name],['ຊື່ (ລາວ)',r.first_name_lo],['ນາມສະກຸນ (ລາວ)',r.last_name_lo],
    ['First name (English)',r.first_name_en],['Last name (English)',r.last_name_en],['ເພດ',r.gender],
    ['ວັນເດືອນປີເກີດ (ລາວ)',r.dob_lo],['Date of birth (English)',r.dob_en],
    ['ບ້ານເກີດ',r.birth_village],['ເມືອງ',r.birth_district],['ແຂວງ',r.birth_province],
    ['ຮຽນຈົບ ມ.7 ຈາກ ມ.ສ',r.high_school],['ເບີໂທ',r.phone],['ເບີໂທພໍ່',r.father_phone],
    ['ເບີໂທແມ່',r.mother_phone],['ເບີໂທສຸກເສີນ',r.emergency_phone]
  ];
  $('#viewBody').innerHTML =
    (r.photo_url?`<img class="detail-photo" src="${esc(r.photo_url)}" alt="">`:'<span class="detail-photo"></span>') +
    `<div class="detail-name">${esc(r.first_name_lo)} ${esc(r.last_name_lo)}</div>
     <div class="detail-sub">${esc(r.first_name_en)} ${esc(r.last_name_en)}</div>` +
    rows.map(([l,val])=>`<div class="detail-row"><span>${l}</span><div>${esc(val)||'-'}</div></div>`).join('');
  $('#viewDlg').showModal();
}
$('#viewClose').onclick=()=>$('#viewDlg').close();

/* ---------- dialogs ---------- */
function openForm(title, bodyHtml, onSave){
  $('#formTitle').textContent = title; $('#formBody').innerHTML = bodyHtml; $('#formErr').textContent='';
  const dlg=$('#formDlg'); dlg.showModal();
  $('#formEl').onsubmit = async e=>{
    e.preventDefault(); const btn=$('#formSave'); btn.disabled=true;
    try{ await onSave(); dlg.close(); toast('ບັນທຶກແລ້ວ'); route(); }
    catch(err){ $('#formErr').textContent = err.message || 'ບັນທຶກບໍ່ສຳເລັດ'; }
    btn.disabled=false;
  };
}
$('#formCancel').onclick=()=>$('#formDlg').close();

$('#authBtn').onclick = async ()=>{
  if(!configured) return;
  if(isAdmin()){ await sb.auth.signOut(); return; }
  $('#lErr').textContent=''; $('#loginDlg').showModal();
};
$('#lCancel').onclick=()=>$('#loginDlg').close();
$('#loginForm').onsubmit = async e=>{
  e.preventDefault(); $('#lSubmit').disabled=true;
  const {error} = await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(), password:$('#lPass').value});
  $('#lSubmit').disabled=false;
  if(error){ $('#lErr').textContent='ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ'; return; }
  $('#lPass').value=''; $('#loginDlg').close();
};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');

/* ---------- start ---------- */
buildNav();
window.addEventListener('hashchange', route);
if(configured){
  sb.auth.getSession().then(({data})=>{ session=data.session; paintAuth(); route(); });
  sb.auth.onAuthStateChange((_e, s)=>{ session=s; paintAuth(); route(); });
}else{ paintAuth(); route(); }
</script>
</body>
</html>
